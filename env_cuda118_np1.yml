name: codex_prep
channels:
  - bioconda
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy<2.0.0
  - cudnn
  - pandas<=2.2.1 # 2.2.1 uses numpy 1.*
  - pillow
  - scipy
  - tensorflow=2.14.1
  - scikit-learn
  - tensorboard
  - tqdm
  - tifffile<=2025.1.10
  - scikit-image<=0.24.0
  - PyWavelets
  - openpyxl
  - pip:
    - hydra-core<=1.3.0
    - hydra_colorlog
    - flowdec
    - ashlar
    - jax<=0.4.7
    - jaxlib<=0.4.7
    - hyperactive==4.4.0
    - basicpy
    - rich
    - tabulate
    - cucim-cu11
    - cupy-cuda11x
    - dask
    - dask-image
    - torch==2.6.0+cu118
    - torchvision==0.21.0+cu118
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - opencv-python<=4.10.0.82
    # - git+https://github.com/fbcotter/pytorch_wavelets
