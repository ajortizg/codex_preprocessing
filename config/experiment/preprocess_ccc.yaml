# @package _global_

defaults:
  - override /data: raw_codex
  - override /pipeline: default
  - override /pipeline/tma_dearray: default

task_name: "preprocess_ccc"

data:
  root_dir: "/storage/groups/interpret_tme/codex_CCC_raw/MY_TMA_CCC_C_CIM_MYedit"
  # root_dir: "outputs/preprocess_ccc/2025-10-30/12-03-04/background_correction"

pipeline:
  remove_intermediate: false

  deconvolution:
    algorithm:
      scale_factor: 0
      n_iter: 25
      use_gpu: true
    devices: [0, 0]

  edof:
    devices: [0, 0]

  illumination_correction:
    n_jobs: 4

  tma_dearray:
    n_jobs: 4
    ref_cycle: 2
    ref_channel: 1

  data_export:
    algorithm:
      remove_markers: ["Empty", "Blank"]
